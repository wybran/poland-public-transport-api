name: Deploy

# Deploys on every push to main, and twice a day rebuilds the GTFS timetable
# from MZK — redeploying only when MZK published a new feed (ETag changed).
#
# Required repository secrets:
#   CF_API_TOKEN   — Cloudflare API token with "Edit Cloudflare Workers" permission
#   CF_ACCOUNT_ID  — Cloudflare account id

on:
  push:
    branches:
      - main
  # GitHub cron is UTC. Off the full hour, when scheduled runs get delayed.
  schedule:
    - cron: "15 3 * * *" # 04:15 / 05:15 Polish time — before the first buses
    - cron: "15 13 * * *" # 14:15 / 15:15 — after MZK office hours, when new feeds get published
  workflow_dispatch:

# Least privilege: the job only reads the repo (deploy uses the Cloudflare token).
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  GTFS_URL: https://www.mzk.zgora.pl/storage/website/dla_deweloperow_gdttq.zip

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    # Cloudflare secrets live in the "production" environment, limited to main
    environment: production
    steps:
      # Actions are pinned to commit SHAs (a moved tag can't inject code);
      # Dependabot bumps them, see .github/dependabot.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check GTFS feed version
        id: gtfs
        run: |
          # MZK's server often times out for non-Polish IPs — retry a few times
          etag=$(curl -sfI --connect-timeout 20 --retry 4 --retry-delay 10 --retry-all-errors "$GTFS_URL" \
            | grep -i '^etag:' | cut -d' ' -f2- | tr -cd 'A-Za-z0-9-' || true)
          echo "etag=${etag:-unknown}" >> "$GITHUB_OUTPUT"

      # On the daily run, skip everything if this feed version was already deployed
      - name: Was this feed already deployed?
        id: seen
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gtfs-deployed
          key: gtfs-${{ steps.gtfs.outputs.etag }}
          lookup-only: true

      - name: Decide
        id: run
        # Daily run: skip when this feed is already live, or when MZK is unreachable
        # (we couldn't tell whether anything changed). Pushes always deploy.
        run: echo "deploy=${{ github.event_name != 'schedule' || (steps.seen.outputs.cache-hit != 'true' && steps.gtfs.outputs.etag != 'unknown') }}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.run.outputs.deploy == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.run.outputs.deploy == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.run.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.run.outputs.deploy == 'true'
        run: pnpm typecheck

      # Last successfully downloaded feed — used when MZK is unreachable,
      # so code changes still deploy with the previous timetable.
      - name: Restore last GTFS feed
        if: steps.run.outputs.deploy == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gtfs-cache
          key: gtfs-zip-${{ steps.gtfs.outputs.etag }}
          restore-keys: gtfs-zip-

      - name: Build GTFS timetable
        if: steps.run.outputs.deploy == 'true'
        run: node scripts/gtfs/build.ts --cache-dir .gtfs-cache

      # ETag of the feed actually built (differs from the one checked above
      # when MZK was unreachable and the cached feed was used)
      - name: Built feed version
        id: built
        if: steps.run.outputs.deploy == 'true'
        run: |
          etag=$(node -p "require('./public/gtfs/meta.json').sourceEtag ?? ''" | tr -cd 'A-Za-z0-9-')
          echo "etag=${etag:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Save GTFS feed
        if: steps.run.outputs.deploy == 'true' && steps.built.outputs.etag != 'unknown'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true # key already exists when the feed didn't change
        with:
          path: .gtfs-cache
          key: gtfs-zip-${{ steps.built.outputs.etag }}

      - name: Deploy to Cloudflare Workers
        if: steps.run.outputs.deploy == 'true'
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Remember deployed feed version
        if: steps.run.outputs.deploy == 'true' && steps.built.outputs.etag != 'unknown'
        run: echo "${{ steps.built.outputs.etag }}" > .gtfs-deployed

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.run.outputs.deploy == 'true' && steps.built.outputs.etag != 'unknown'
        continue-on-error: true
        with:
          path: .gtfs-deployed
          key: gtfs-${{ steps.built.outputs.etag }}
